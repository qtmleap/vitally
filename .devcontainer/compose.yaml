services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - node_modules:/home/vscode/app/node_modules
      - ../:/home/vscode/app:cached
    environment:
      NODE_OPTIONS: "--no-deprecation"
    tty: true
    stdin_open: true
    ports:
      - 11000:11000

volumes:
  node_modules:
